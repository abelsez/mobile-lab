name: decompile
on:
  workflow_dispatch:
    inputs:
      apk_url:   {description: "APK URL (https)", required: true}
      name:      {description: "label", required: false, default: "target"}
jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: fetch apk
        run: |
          mkdir -p work && cd work
          curl -sSL --retry 3 -o app.apk "${{ inputs.apk_url }}"
          ls -l app.apk && sha256sum app.apk | tee sha256.txt
      - name: tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool unzip zip python3-pip >/dev/null
          pip install -q androguard loguru
          curl -sSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q jadx.zip -d jadx && chmod +x jadx/bin/jadx
      - name: raw artifacts
        run: |
          cd work
          unzip -o -q app.apk -d apk_raw || true
          apktool d -f -s -o decoded app.apk > apktool.log 2>&1 || true
          cp decoded/AndroidManifest.xml manifest.xml 2>/dev/null || true
      - name: jadx (full sources)
        run: |
          cd work
          timeout 3000 ../jadx/bin/jadx -d jadx-out --no-res app.apk > jadx.log 2>&1 || true
          du -sh jadx-out || true
      - name: androguard sweeps
        run: |
          cd work
          python3 - <<'PY' > strings_and_xrefs.txt 2>&1 || true
          from androguard.core.dex import DEX
          import glob, re
          needles = ("loadUrl","addJavascriptInterface","setAllowUniversalAccessFromFileURLs",
                     "setAllowFileAccess","shouldOverrideUrlLoading","evaluateJavascript",
                     "getQueryParameter","getDataString","getExtras","startActivity","sendBroadcast")
          for f in sorted(glob.glob("apk_raw/classes*.dex")):
              d = DEX(open(f,"rb").read())
              print(f"## {f}")
              for c in d.get_classes():
                  for m in c.get_methods():
                      try: code = m.get_code()
                      except Exception: continue
                      if not code: continue
                      try: s = " ".join(str(i) for i in code.get_instructions())
                      except Exception: continue
                      for n in needles:
                          if n in s: print(f"  {c.get_name()}->{m.get_name()} : {n}")
          PY
      - name: package
        run: |
          cd work
          zip -qr manifest_and_strings.zip manifest.xml strings_and_xrefs.txt apktool.log jadx.log sha256.txt
          tar czf jadx-sources.tgz jadx-out 2>/dev/null || true
          ls -lh *.zip *.tgz || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-static
          path: |
            work/manifest_and_strings.zip
            work/jadx-sources.tgz
          retention-days: 14
